[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-content-engine"
version = "0.2.0"
description = "Human-reviewed AI workflow for vertical social videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "openai>=1.50,<3",
  "httpx>=0.27,<1",
  "cryptography>=44,<47",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
